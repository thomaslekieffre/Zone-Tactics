name: Supabase keepalive

# Empêche le projet Supabase free de se mettre en pause :
# on tape /auth/v1/health (200 sans auth) + un select 1 ligne sur `profiles`,
# qui constitue une vraie requête SQL et compte comme activité projet.
on:
  schedule:
    - cron: "17 6 * * *" # tous les jours à 06:17 UTC
  workflow_dispatch:

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "::error::secrets SUPABASE_URL et SUPABASE_PUBLISHABLE_KEY manquants"
            exit 1
          fi

          echo "→ /auth/v1/health"
          curl -fsS "${SUPABASE_URL}/auth/v1/health" -o /dev/null
          echo "  ok"

          echo "→ /rest/v1/profiles?select=id&limit=1"
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Accept: application/json" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" || echo "000")
          echo "  http=${status}"
          if [ "${status}" != "200" ] && [ "${status}" != "206" ]; then
            echo "::warning::REST ping a renvoye ${status} (le health suffit pour compter comme activite)"
          fi

          echo "OK ping $(date -u +%FT%TZ)"
