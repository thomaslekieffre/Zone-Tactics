name: Supabase keepalive

# Empêche le projet Supabase free de se mettre en pause :
# un simple GET /rest/v1/ chaque jour suffit à compter comme activité.
on:
  schedule:
    - cron: "17 6 * * *" # tous les jours à 06:17 UTC
  workflow_dispatch:

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "::error::secrets SUPABASE_URL et SUPABASE_PUBLISHABLE_KEY manquants"
            exit 1
          fi
          # On tape un endpoint léger ; -f fait échouer en cas de 4xx/5xx, -sS reste silencieux mais affiche les erreurs.
          curl -fsS \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/?select=*" -o /dev/null
          echo "OK ping $(date -u +%FT%TZ)"
